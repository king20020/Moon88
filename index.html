<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03080f;--sur:#070f1a;--s2:#0c1826;--s3:#111f33;
  --b:rgba(0,210,255,.1);--bb:rgba(0,210,255,.28);
  --cy:#00d2ff;--cyd:rgba(0,210,255,.55);
  --bl:#0070ff;--re:#ff3d5a;--gr:#00ffb3;--ye:#ffd700;
  --tx:#e8f4ff;--tm:#5a7a99;
  --fd:'Oxanium',monospace;--fb:'Rajdhani',sans-serif;
  --ch-size:72px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fb);overflow-x:hidden;-webkit-tap-highlight-color:transparent;text-rendering:optimizeSpeed}
img{content-visibility:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ── VIDEO ── */
#video{will-change:auto;transform:translateZ(0);background:#000}

.app{min-height:100vh;background:var(--bg);padding:12px 10px calc(56px + var(--safe-b))}
.inner{max-width:1340px;margin:0 auto}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--b);flex-wrap:wrap;gap:8px}
.lw{display:flex;align-items:center;gap:10px}
.li{width:40px;height:40px;background:linear-gradient(135deg,#0070ff,#00d2ff);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 8px rgba(0,112,255,.3);flex-shrink:0}
.lt{font-family:var(--fd);font-size:clamp(14px,4vw,24px);font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#fff 0%,var(--cy) 55%,#0070ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.ls{font-size:9px;color:var(--tm);letter-spacing:3px;text-transform:uppercase;margin-top:2px}
.hr{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lb{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:5px 10px;border-radius:100px;font-family:var(--fd);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px}
.lb.on{background:rgba(0,210,255,.1);border-color:var(--cyd);color:var(--cy)}
.theme-btn{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:5px 9px;border-radius:100px;font-family:var(--fd);font-size:11px;cursor:pointer}
.live{display:flex;align-items:center;gap:5px;background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.35);color:var(--re);font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:2px;padding:5px 10px;border-radius:100px}
.dot{width:6px;height:6px;background:var(--re);border-radius:50%}

body.day-mode{--bg:#eef2f7;--sur:#fff;--s2:#e4eaf2;--s3:#d8e1ee;--b:rgba(0,100,200,.11);--bb:rgba(0,100,200,.28);--cy:#005db8;--cyd:rgba(0,93,184,.5);--tx:#0d1b2a;--tm:#7090b0}
body.day-mode .lt{background:linear-gradient(90deg,#0d1b2a,#005db8,#0070ff);-webkit-background-clip:text;background-clip:text}

/* ── TABS ── */
.nav-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.ntb{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:6px 13px;border-radius:10px;font-family:var(--fd);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.ntb.on{background:rgba(0,112,255,.13);border-color:rgba(0,112,255,.38);color:#6ab0ff}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:1fr 295px;gap:12px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}

/* ── PLAYER CARD ── */
.pc{background:var(--sur);border:1px solid var(--b);border-radius:15px;overflow:hidden}
.ps{display:flex;gap:5px;overflow-x:auto;padding:8px 10px;background:var(--s2);border-bottom:1px solid var(--b);scrollbar-width:none;align-items:center}
.ps::-webkit-scrollbar{display:none}
.sc{background:rgba(0,210,255,.04);border:1px solid var(--b);padding:4px 8px;border-radius:7px;min-width:72px;flex-shrink:0}
.sl{font-size:9px;color:var(--cyd);text-transform:uppercase;letter-spacing:1.5px;font-family:var(--fd);margin-bottom:1px}
.sv{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--tx)}

.enh-toggle{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 9px;background:rgba(0,210,255,.04);border:1px solid var(--b);border-radius:8px;cursor:pointer;margin-left:auto}
.enh-toggle.on{background:rgba(0,255,179,.07);border-color:rgba(0,255,179,.4)}
.enh-lbl{font-size:9px;color:var(--tm);font-family:var(--fd);letter-spacing:1px;text-transform:uppercase}
.enh-toggle.on .enh-lbl{color:var(--gr)}
.enh-sw{width:26px;height:14px;background:var(--s3);border-radius:100px;position:relative;flex-shrink:0}
.enh-toggle.on .enh-sw{background:linear-gradient(90deg,#00c896,#00ffb3)}
.enh-sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff}
.enh-toggle.on .enh-sw::after{transform:translateX(12px)}

.qual-wrap{display:none;align-items:center;gap:5px;flex-shrink:0}
.qual-wrap.vis{display:flex}
.qual-lbl{font-size:9px;color:var(--cyd);font-family:var(--fd);letter-spacing:1px;text-transform:uppercase}
.qual-sel{background:var(--s3);border:1px solid var(--bb);color:var(--cy);font-family:var(--fd);font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;max-width:90px}
.qual-sel option{background:var(--s2);color:var(--tx)}

/* Video wrapper + overlays */
.vc{position:relative;background:#000}
.vc video{width:100%;aspect-ratio:16/9;display:block;background:#000}
.voverlay{position:absolute;top:7px;right:7px;display:flex;gap:5px;z-index:2}
.vob{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-family:var(--fd);font-weight:700;letter-spacing:.4px}
.vol-overlay{position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:center;gap:6px;z-index:2;pointer-events:none}
.vol-overlay > *{pointer-events:auto}
.vol-mute{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-family:var(--fd)}
.vol-sl{flex:1;max-width:140px;-webkit-appearance:none;appearance:none;height:3px;background:rgba(255,255,255,.25);border-radius:2px;outline:none;cursor:pointer}
.vol-sl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--cy);cursor:pointer}
.spinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.32);z-index:3;color:#fff;font-family:var(--fd);font-size:12px;letter-spacing:1px;pointer-events:none}
.spinner.on{display:flex}
.spinner .sp-ring{width:32px;height:32px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--cy);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.ve{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tm);font-family:var(--fd);font-size:13px;background:#000;text-align:center;padding:10px}
.ei{font-size:30px;opacity:.38}
.dead-info{font-size:11px;color:rgba(255,61,90,.7);margin-top:4px;font-family:var(--fd);letter-spacing:.4px}
.retry-btn{margin-top:6px;background:rgba(0,210,255,.1);border:1px solid var(--bb);color:var(--cy);padding:6px 14px;border-radius:8px;font-family:var(--fd);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.6px}

.ci{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--b)}
.cl{width:42px;height:42px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;padding:3px;position:relative}
.cl img{width:100%;height:100%;object-fit:contain}
.cl .ltr-avatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0070ff,#00d2ff);color:#fff;font-family:var(--fd);font-weight:800;font-size:16px;border-radius:8px}
.cl.no-logo img{display:none}
.cl.no-logo .ltr-avatar{display:flex}
.cnw{font-size:9px;color:var(--cyd);font-family:var(--fd);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.cn{font-family:var(--fd);font-size:16px;font-weight:700;line-height:1.1}
.cc{font-size:11px;color:var(--tm);margin-top:1px}
.dur-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,210,255,.07);border:1px solid var(--b);padding:2px 7px;border-radius:100px;font-family:var(--fd);font-size:10px;color:var(--cyd);margin-top:3px;cursor:pointer}
.ci-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.act-btn{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:5px 10px;border-radius:8px;font-family:var(--fd);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.fav-btn{font-size:18px;background:none;border:none;cursor:pointer;padding:3px;line-height:1}

/* Battery / data-saver banner */
.banner{display:none;align-items:center;gap:6px;padding:6px 11px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);color:var(--ye);font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.4px;border-radius:9px;margin:0 0 9px}
.banner.vis{display:flex}
.banner-close{background:none;border:none;color:var(--ye);cursor:pointer;font-size:13px;margin-left:auto;padding:0 5px;font-family:var(--fd)}

/* ── SIDEBAR ── */
.sb{background:var(--sur);border:1px solid var(--b);border-radius:15px;display:flex;flex-direction:column;max-height:760px;overflow:hidden}
.sbh{padding:10px;border-bottom:1px solid var(--b);flex-shrink:0}
.sbt{font-family:var(--fd);font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.cnt{font-size:10px;color:var(--cy);background:rgba(0,210,255,.07);border:1px solid rgba(0,210,255,.18);padding:2px 7px;border-radius:100px;font-family:var(--fd)}
.sw{position:relative}
.sw input{width:100%;background:var(--s2);border:1px solid var(--b);color:var(--tx);padding:7px 11px 7px 27px;border-radius:8px;font-family:var(--fb);font-size:13px;outline:none}
.sw input:focus{border-color:var(--cyd)}
.sw input::placeholder{color:var(--tm)}
.sico{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--tm);font-size:12px;pointer-events:none}

.size-bar{display:flex;align-items:center;gap:6px;padding:5px 10px;flex-shrink:0;border-bottom:1px solid var(--b);background:var(--s2)}
.size-lbl{font-size:9px;color:var(--tm);font-family:var(--fd);letter-spacing:1px;white-space:nowrap}
.size-btn{background:var(--s3);border:1px solid var(--b);color:var(--tm);width:24px;height:24px;border-radius:6px;font-family:var(--fd);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.size-slider{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:var(--s3);border-radius:2px;outline:none;cursor:pointer}
.size-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cy);cursor:pointer}
.size-val{font-size:9px;color:var(--cy);font-family:var(--fd);font-weight:700;min-width:22px;text-align:center}

.cats{display:flex;gap:4px;overflow-x:auto;padding:6px 10px 0;flex-shrink:0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cb{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:4px 9px;border-radius:100px;font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.4px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cb.on{background:rgba(0,210,255,.1);border-color:var(--cyd);color:var(--cy)}
.chl{overflow-y:auto;flex:1;padding:5px;scrollbar-width:thin;scrollbar-color:var(--b) transparent;contain:strict;will-change:scroll-position}
.chl::-webkit-scrollbar{width:3px}
.chl::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}

.chi{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;background:none;width:100%;text-align:left;color:var(--tx);-webkit-tap-highlight-color:transparent;min-height:var(--ch-size);content-visibility:auto;contain-intrinsic-size:auto var(--ch-size)}
.chi.on{background:rgba(0,112,255,.11);border-color:rgba(0,112,255,.32)}
.chi.dead{opacity:.45;cursor:default}
.chi.dead .chn{text-decoration:line-through;color:var(--tm)}
.chlo{background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:3px;flex-shrink:0;overflow:hidden;position:relative;
  width:calc(var(--ch-size) * 0.55);
  height:calc(var(--ch-size) * 0.55);
  min-width:28px;min-height:28px}
.chlo img{width:100%;height:100%;object-fit:contain}
.chlo.no-logo img{display:none}
.chlo.no-logo::before{content:attr(data-letter);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0070ff,#00d2ff);color:#fff;font-family:var(--fd);font-weight:800;font-size:13px;border-radius:6px}
.chm{overflow:hidden;flex:1;min-width:0}
.chn{font-family:var(--fb);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;
  font-size:clamp(10px, calc(var(--ch-size) * 0.18), 15px)}
.chc{color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  font-size:clamp(9px, calc(var(--ch-size) * 0.14), 12px)}
.ch-dur{font-size:9px;color:var(--cyd);font-family:var(--fd);margin-top:2px}
.ch-fav{font-size:13px;background:none;border:none;cursor:pointer;padding:2px;line-height:1;opacity:.4;flex-shrink:0}
.chi.fav .ch-fav{opacity:1}
.chst{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chst.ok{background:var(--gr)}
.chst.unk{background:var(--tm)}
.chst.dead{background:var(--re)}
.dead-tag{font-size:8px;background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.3);color:var(--re);padding:1px 5px;border-radius:4px;font-family:var(--fd);letter-spacing:.5px;flex-shrink:0;white-space:nowrap}

/* Sections */
.fav-section,.my-sec{border-top:1px solid var(--b);flex-shrink:0}
.fav-hdr,.my-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;cursor:pointer;font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.5px}
.fav-hdr{color:var(--ye)}
.my-hdr{color:var(--cy);cursor:default}
.fav-hdr span,.my-hdr span{opacity:.6;font-size:9px;color:var(--tm);font-weight:400}
.my-clear{font-size:9px;color:var(--re);cursor:pointer;font-weight:700;font-family:var(--fd);letter-spacing:.4px}
.fav-list,.my-list{padding:0 5px 5px;max-height:200px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b) transparent;display:none}
.fav-list.open,.my-list.open{display:block}

/* "All Channels" header above the main list (so it lives at the bottom of the sidebar) */
.all-ch-hdr{display:flex;align-items:center;gap:8px;border-top:2px solid var(--b);margin-top:8px;padding:10px 10px 6px;font-family:var(--fd);font-size:13px;font-weight:800;color:var(--cy);letter-spacing:.5px}
.all-ch-hdr .all-ch-sub{margin-inline-start:auto;font-size:10px;font-weight:600;color:var(--tm);opacity:.85}

/* ── PACKS (regions / categories) ── */
.packs-section{background:var(--sur);border:1px solid var(--b);border-radius:15px;margin-top:10px;overflow:hidden}
.packs-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;font-family:var(--fd);font-size:13px;font-weight:700;color:var(--cy);border-bottom:1px solid transparent}
.packs-hdr.open{border-bottom-color:var(--b)}
.packs-sub{font-size:10px;color:var(--tm);font-weight:400;letter-spacing:.4px;margin-top:2px}
.packs-body{display:none;padding:10px}
.packs-body.open{display:block}
.packs-group-label{font-size:9px;letter-spacing:1.5px;color:var(--tm);text-transform:uppercase;font-family:var(--fd);margin:8px 4px 5px}
.packs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.pack-btn{background:var(--s2);border:1px solid var(--b);color:var(--tx);padding:8px 9px;border-radius:9px;font-family:var(--fd);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;white-space:nowrap}
.pack-btn.loaded{background:rgba(0,255,179,.07);border-color:rgba(0,255,179,.32);color:var(--gr)}
.pack-btn.loading{background:rgba(0,210,255,.07);border-color:var(--bb);color:var(--cy);cursor:wait}
.pack-btn.failed{background:rgba(255,61,90,.06);border-color:rgba(255,61,90,.25);color:var(--re)}
.pack-count{font-size:9px;opacity:.7;letter-spacing:.4px}
.pack-bulk-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pack-bulk{background:linear-gradient(90deg,#0070ff,#00d2ff);color:#fff;border:none;padding:8px 13px;border-radius:9px;font-family:var(--fd);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px}
.pack-bulk.alt{background:var(--s2);color:var(--cy);border:1px solid var(--bb)}

/* ── ADD SECTION ── */
.as{margin-top:10px;background:var(--sur);border:1px solid var(--b);border-radius:15px;overflow:hidden}
.ah{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;border-bottom:1px solid transparent}
.ah.open{border-bottom-color:var(--b)}
.aht{font-family:var(--fd);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--cy)}
.atg{width:21px;height:21px;border:1px solid var(--bb);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--cy);font-size:14px}
.af{padding:13px;display:none;flex-direction:column;gap:8px}
.af.open{display:flex}
.fi{display:flex;flex-direction:column;gap:3px}
.fi label{font-size:9px;color:var(--tm);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--fd)}
.fi textarea{background:var(--s2);border:1px solid var(--b);color:var(--tx);padding:9px 11px;border-radius:8px;font-family:monospace;font-size:11px;outline:none;width:100%;resize:vertical;min-height:80px;line-height:1.5}
.fi textarea:focus{border-color:var(--cyd)}
.badd{background:linear-gradient(90deg,#0070ff,#00d2ff);color:#fff;border:none;padding:10px;border-radius:9px;font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;width:100%}

/* Modals + share */
.share-mc{background:var(--sur);border:1px solid var(--bb);border-radius:18px;padding:20px 16px;width:100%;max-width:360px}
.stream-url-box{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:8px 10px;font-family:monospace;font-size:10px;color:var(--tm);word-break:break-all;margin:8px 0;line-height:1.5;max-height:70px;overflow-y:auto}
.share-apps{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.sapp{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--s2);border:1px solid var(--b);border-radius:9px;padding:8px 11px;cursor:pointer;font-size:9px;font-family:var(--fd);color:var(--tm);text-decoration:none;font-weight:700;letter-spacing:.4px}
.sapp-ico{font-size:18px}

.dur-modal-inner{background:var(--sur);border:1px solid var(--bb);border-radius:18px;padding:20px;width:100%;max-width:300px}
.dur-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.dur-preset{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:8px;border-radius:9px;font-family:var(--fd);font-size:11px;font-weight:700;cursor:pointer;text-align:center}
.dur-input-wrap{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--b);border-radius:9px;padding:8px 12px;margin-bottom:10px}
.dur-input-wrap input{background:none;border:none;outline:none;color:var(--cy);font-family:var(--fd);font-size:16px;font-weight:700;width:60px;text-align:center}
.dur-unit{font-size:11px;color:var(--tm);font-family:var(--fd)}

/* Settings modal */
.set-mc{background:var(--sur);border:1px solid var(--bb);border-radius:18px;padding:20px 16px;width:100%;max-width:320px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:8px;border-bottom:1px solid var(--b)}
.set-row:last-of-type{border-bottom:none}
.set-lbl{font-family:var(--fd);font-size:12px;color:var(--tx);font-weight:700}
.set-desc{font-size:10px;color:var(--tm);margin-top:2px;font-family:var(--fb)}
.set-toggle{width:36px;height:18px;background:var(--s3);border-radius:100px;position:relative;flex-shrink:0;cursor:pointer;border:none;padding:0}
.set-toggle.on{background:linear-gradient(90deg,#0070ff,#00d2ff)}
.set-toggle::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.set-toggle.on::after{transform:translateX(18px)}

/* Support page */
.sup-page{}
.sup-hero{background:linear-gradient(135deg,rgba(0,112,255,.13),rgba(0,210,255,.07),transparent);border:1px solid var(--bb);border-radius:18px;padding:28px 22px;text-align:center;margin-bottom:16px}
.sup-hero-icon{font-size:40px;margin-bottom:10px;display:block}
.sup-hero-title{font-family:var(--fd);font-size:clamp(17px,4vw,26px);font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sup-hero-sub{font-size:13px;color:var(--tm);max-width:480px;margin:0 auto;line-height:1.7}
.sup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:560px){.sup-grid{grid-template-columns:1fr}}
.sup-card{background:var(--sur);border:1px solid var(--b);border-radius:14px;padding:18px}
.sup-card-icon{font-size:24px;margin-bottom:8px}
.sup-card-title{font-family:var(--fd);font-size:13px;font-weight:700;margin-bottom:4px}
.sup-card-text{font-size:12px;color:var(--tm);line-height:1.6}
.sup-donate-box{background:var(--sur);border:1px solid var(--bb);border-radius:16px;padding:22px;text-align:center}
.sup-donate-title{font-family:var(--fd);font-size:17px;font-weight:800;margin-bottom:5px}
.sup-donate-sub{font-size:12px;color:var(--tm);margin-bottom:16px;line-height:1.6}
.fp-wrap{background:linear-gradient(160deg,#0d1b2a,#1b2838);border-radius:17px;padding:3px;max-width:240px;margin:0 auto}
.fp-inner{background:#f2f4f7;border-radius:15px;overflow:hidden;font-family:system-ui,sans-serif}
.fp-top{background:#e63946;padding:6px 11px 0;display:flex;justify-content:space-between}
.fp-top span{color:#fff;font-size:8px;opacity:.85}
.fp-header{background:#e63946;padding:7px 11px 11px;text-align:center}
.fp-sub{color:rgba(255,255,255,.7);font-size:8px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.fp-title{color:#fff;font-size:14px;font-weight:800}
.fp-body{padding:9px 9px 4px}
.fp-label{font-size:7px;color:#888;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.fp-recipient{background:#fff;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.fp-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0070ff,#00d2ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.fp-name{font-weight:700;font-size:10px;color:#111}
.fp-role{font-size:8px;color:#888}
.fp-check{margin-left:auto;color:#00c48c;font-size:12px}
.fp-phone{background:#fff;border-radius:8px;padding:8px;text-align:center;margin-bottom:7px;font-size:17px;font-weight:800;letter-spacing:3px;color:#111;font-family:monospace}
.fp-btn{background:linear-gradient(90deg,#e63946,#c1121f);border-radius:8px;padding:8px;text-align:center;color:#fff;font-weight:700;font-size:10px;margin-bottom:8px}
.fp-footer{background:#fff;border-top:1px solid #eee;padding:4px 14px;display:flex;justify-content:space-around}
.fp-ico{font-size:14px}
.pd{background:var(--s2);border:1px solid var(--bb);border-radius:10px;padding:10px;text-align:center;margin:10px auto;max-width:240px}
.pdl{font-size:9px;color:var(--tm);letter-spacing:2px;text-transform:uppercase;font-family:var(--fd);margin-bottom:2px}
.pdn{font-family:var(--fd);font-size:11px;color:var(--cy);margin-bottom:2px}
.pdnum{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:3px;color:var(--tx)}
.btg{display:inline-flex;align-items:center;gap:6px;background:rgba(0,136,204,.13);border:1px solid rgba(0,136,204,.38);color:#29b6f6;padding:8px 14px;border-radius:9px;font-family:var(--fd);font-size:12px;font-weight:700;text-decoration:none;letter-spacing:.4px;cursor:pointer}
.bdn{display:inline-flex;align-items:center;gap:6px;background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.38);color:#ff7080;padding:8px 14px;border-radius:9px;font-family:var(--fd);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.4px}
.bback{display:flex;align-items:center;gap:6px;background:rgba(0,210,255,.07);border:1px solid rgba(0,210,255,.22);color:#00d2ff;padding:6px 13px;border-radius:100px;font-family:var(--fd);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.4px;margin-bottom:13px}
.bcp{width:100%;background:linear-gradient(90deg,#0070ff,#00d2ff);color:#fff;border:none;padding:9px;border-radius:8px;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:5px}
.bcl{width:100%;background:transparent;color:var(--tm);border:1px solid var(--b);padding:7px;border-radius:8px;font-family:var(--fd);font-size:11px;cursor:pointer;margin-top:5px}

/* Footer */
.ftr{margin-top:16px;background:var(--sur);border:1px solid var(--b);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ft{font-family:var(--fd);font-size:13px;font-weight:700;margin-bottom:3px}
.fs{font-size:11px;color:var(--tm)}
.fa{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

/* Modal base */
.mo{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:12px}
.mo.show{display:flex}
.mb{background:var(--sur);border:1px solid var(--bb);border-radius:18px;padding:20px 16px;width:100%;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mtt{font-family:var(--fd);font-size:14px;font-weight:800;text-align:center;margin-bottom:4px}
.mts{font-size:11px;color:var(--tm);text-align:center;margin-bottom:11px;line-height:1.5}

.loading-bar{height:2px;background:linear-gradient(90deg,var(--bl),var(--cy));width:0%;border-radius:2px;position:fixed;top:0;left:0;z-index:9999;transition:width .25s}
.lh{text-align:center;padding:6px;font-size:11px;color:var(--tm);font-family:var(--fd);letter-spacing:1px}

.toast{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--bb);color:var(--cy);font-family:var(--fd);font-size:12px;font-weight:700;padding:7px 16px;border-radius:100px;z-index:2000;letter-spacing:.4px;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.hide{display:none}

.sort-bar{display:flex;align-items:center;gap:5px;padding:5px 10px;flex-shrink:0;border-bottom:1px solid var(--b)}
.sort-lbl{font-size:9px;color:var(--tm);font-family:var(--fd);letter-spacing:1px;white-space:nowrap}
.sort-btn{background:var(--s2);border:1px solid var(--b);color:var(--tm);padding:3px 8px;border-radius:6px;font-family:var(--fd);font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap}
.sort-btn.on{background:rgba(0,210,255,.1);border-color:var(--cyd);color:var(--cy)}

/* ── COUNTRIES HUB ── */
.cs-page{}
.cs-hdr{padding:14px 4px 10px;text-align:center}
.cs-title{font-family:var(--fd);font-size:clamp(18px,5vw,26px);font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#fff,var(--cy),var(--bl));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.day-mode .cs-title{background:linear-gradient(90deg,#0d1b2a,#005db8,#0070ff);-webkit-background-clip:text;background-clip:text}
.cs-sub{font-family:var(--fb);font-size:13px;color:var(--tm);margin-top:4px}
.cs-group-lbl{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--cy);letter-spacing:.8px;margin:18px 6px 8px;padding-bottom:4px;border-bottom:1px solid var(--b)}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.country-tile{background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:14px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s ease,background .15s ease,border-color .15s ease;contain:content;content-visibility:auto;contain-intrinsic-size:108px 110px}
.country-tile:hover{background:var(--s3);border-color:var(--bb);transform:translateY(-2px)}
.country-tile:active{transform:scale(.95)}
.country-tile.loading{opacity:.7}
.country-tile.empty{opacity:.55}
.ct-flag{font-size:34px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.ct-name{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--tx);letter-spacing:.3px;text-align:center;line-height:1.2;min-height:1.2em;word-break:break-word}
.ct-count{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--cy);background:rgba(0,210,255,.1);padding:2px 7px;border-radius:7px;letter-spacing:.5px}
.country-tile.empty .ct-count{color:var(--tm);background:rgba(255,255,255,.04)}

/* ── COUNTRY DETAIL PAGE ── */
.cl-page{}
.country-page-hdr{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--sur);border:1px solid var(--b);border-radius:14px;margin-bottom:11px;flex-wrap:wrap}
.cph-back{background:rgba(0,210,255,.07);border:1px solid rgba(0,210,255,.22);color:var(--cy);padding:7px 12px;border-radius:100px;font-family:var(--fd);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.4px;flex-shrink:0}
.cph-flag{font-size:32px;line-height:1;flex-shrink:0}
.cph-info{min-width:0;flex:1}
.cph-title{font-family:var(--fd);font-size:17px;font-weight:800;color:var(--tx);letter-spacing:.4px}
.cph-sub{font-family:var(--fb);font-size:11px;color:var(--tm);margin-top:1px}
.cph-search{flex:1 1 200px;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:6px 10px;min-width:140px}
.cph-search input{flex:1;background:none;border:none;color:var(--tx);font-family:var(--fb);font-size:13px;outline:none;min-width:0}
.cph-empty{padding:32px 16px;text-align:center;color:var(--tm);font-family:var(--fd);font-size:13px;background:var(--sur);border:1px dashed var(--b);border-radius:14px}
.cph-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;padding:2px 0}
.cph-list .chi{height:auto;min-height:60px}

@media(max-width:560px){
  .app{padding:9px 8px calc(44px + var(--safe-b))}
  .ftr{flex-direction:column;align-items:flex-start}
  .fa{justify-content:flex-start}
  .country-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .ct-flag{font-size:30px}
  .cph-list{grid-template-columns:1fr 1fr;gap:6px}
  .cph-search{flex-basis:100%;order:99}
}
</style>
</head>

<div class="loading-bar" id="loadBar"></div>
<div class="toast hide" id="toast"></div>

<!-- DONATE MODAL -->
<div class="mo" id="donateModal">
  <div class="mb">
    <div class="mtt">💳 <span data-t="donateModalTitle"></span></div>
    <div class="mts" data-t="donateModalSub"></div>
    <div class="fp-wrap"><div class="fp-inner">
      <div class="fp-top"><span>9:41</span><span>●●● 🔋</span></div>
      <div class="fp-header"><div class="fp-sub" data-t="fastpayLabel"></div><div class="fp-title">💳 <span data-t="transfer"></span></div></div>
      <div class="fp-body">
        <div class="fp-label" data-t="recipient"></div>
        <div class="fp-recipient"><div class="fp-avatar">I</div><div><div class="fp-name">Ibrahim King</div><div class="fp-role">Developer</div></div><div class="fp-check">✓</div></div>
        <div class="fp-label" data-t="phoneNum"></div>
        <div class="fp-phone">07511299451</div>
        <div class="fp-btn" data-t="sendMoney"></div>
      </div>
      <div class="fp-footer"><span class="fp-ico">🏠</span><span class="fp-ico">💳</span><span class="fp-ico">📤</span><span class="fp-ico" style="opacity:.35">⚙️</span></div>
    </div></div>
    <div class="pd"><div class="pdl" data-t="fastpayLabel"></div><div class="pdn">Ibrahim King</div><div class="pdnum">07511299451</div></div>

    <button class="bcl" data-act="close-modal" data-modal="donateModal" data-t="donateClose"></button>

<!-- SHARE MODAL -->
<div class="mo" id="shareModal">
  <div class="share-mc">
    <div class="mtt">📡 <span data-t="shareTitle"></span></div>
    <div class="mts" id="shareChName" style="color:var(--cy)"></div>
    <div class="stream-url-box" id="shareUrl"></div>
    <div class="share-apps" id="shareApps"></div>
    <button class="bcp" data-act="copy-share-url" data-t="copyUrl"></button>
    <button class="bcl" data-act="close-modal" data-modal="shareModal" data-t="donateClose"></button>

</div>

<!-- DURATION MODAL -->
<div class="mo" id="durModal">
  <div class="dur-modal-inner">
    <div class="mtt">⏱ <span data-t="setDuration"></span></div>
    <div class="mts" id="durChName" style="color:var(--cy)"></div>
    <div class="dur-input-wrap">
      <input type="number" id="durInput" min="1" max="9999" placeholder="60"/>
      <span class="dur-unit" data-t="minutes"></span>
    </div>
    <div class="dur-grid">
      <button class="dur-preset" data-act="dur-preset" data-mins="15">15 <span data-t="min"></span></button>
      <button class="dur-preset" data-act="dur-preset" data-mins="30">30 <span data-t="min"></span></button>
      <button class="dur-preset" data-act="dur-preset" data-mins="60">1 <span data-t="hour"></span></button>
      <button class="dur-preset" data-act="dur-preset" data-mins="120">2 <span data-t="hours"></span></button>
      <button class="dur-preset" data-act="dur-preset" data-mins="0" style="grid-column:span 2;color:var(--re)">✕ <span data-t="clearDur"></span></button>
    </div>
    <button class="bcp" data-act="save-duration" data-t="save"></button>
    <button class="bcl" data-act="close-modal" data-modal="durModal" data-t="donateClose"></button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="mo" id="setModal">
  <div class="set-mc">
    <div class="mtt">⚙️ <span data-t="settings"></span></div>
    <div class="set-row">
      <div><div class="set-lbl" data-t="dataSaver"></div><div class="set-desc" data-t="dataSaverDesc"></div></div>
      <button class="set-toggle" id="setDS" data-act="toggle-ds"></button>
    </div>
    <div class="set-row">
      <div><div class="set-lbl" data-t="autoplay"></div><div class="set-desc" data-t="autoplayDesc"></div></div>
      <button class="set-toggle on" id="setAuto" data-act="toggle-auto"></button>
    </div>
    <div class="set-row">
      <div><div class="set-lbl" data-t="wakeLock"></div><div class="set-desc" data-t="wakeLockDesc"></div></div>
      <button class="set-toggle on" id="setWake" data-act="toggle-wake"></button>
    </div>
    <div class="set-row">

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function T(k){const v=(LANGS[state.lang]||LANGS.ku)[k];return v==null?k:v}
function isRTL(){return (LANGS[state.lang]||LANGS.ku).dir==="rtl"}

function rIdle(fn,timeout=400){
  if(window.requestIdleCallback)return requestIdleCallback(fn,{timeout});
  return setTimeout(fn,1);
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

let _tt;
function showToast(msg){
  const t=$("toast");t.textContent=msg;t.classList.remove("hide");
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.add("hide"),2400);
}
function setBar(p){const b=$("loadBar");b.style.width=Math.max(0,Math.min(100,p))+"%"}

function letterOf(name){const c=(name||"?").replace(/[^a-zA-Z\u0600-\u06FF]/g,"").charAt(0).toUpperCase();return c||"?"}

function lsGet(k,def){if(!supportsStorage)return def;try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){if(!supportsStorage)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){if(!supportsStorage)return;try{localStorage.removeItem(k)}catch(e){}}

function prefsLoad(){
  const p=lsGet("prefs_v1",{})||{};

  state.autoplay=p.autoplay!==false;
  state.wakeLockOn=p.wakeLockOn!==false;
  state.muteWhenHidden=p.muteWhenHidden!==false;
  state.dayMode=!!p.dayMode;
  state.lang=p.lang||"ku";
  state.sortMode=p.sortMode||"default";
  state.lastVolume=p.lastVolume==null?1:p.lastVolume;
  state.lastMuted=!!p.lastMuted;
}

    lastVolume:state.lastVolume,lastMuted:state.lastMuted,
  });
}

function packCacheGet(k){
  const r=lsGet(packCacheKey(k),null);
  if(!r||typeof r!=="object")return null;
  if(Date.now()-r.t>PACK_TTL_MS)return null;
  return r;
}
function packCacheSet(k,channels){lsSet(packCacheKey(k),{t:Date.now(),channels})}
function packCacheClearAll(){
  if(!supportsStorage)return;
  Object.keys(PACKS).forEach(k=>lsDel(packCacheKey(k)));
}

function registerSW(){
  // Single-file build: no separate sw.js. Skip registration to avoid 404.
  // Unregister any previously cached SW from older multi-file build:
  if(!("serviceWorker" in navigator))return;
  navigator.serviceWorker.getRegistrations().then(rs=>{
    rs.forEach(r=>{try{r.unregister()}catch(e){}});
  }).catch(()=>{});
}

function applyNetInfo(){
  const c=navigator.connection;
  if(c){
    state.netInfo.dl=c.downlink||0;
    state.netInfo.saveData=!!c.saveData;
    state.netInfo.slow=/^(slow-2g|2g)$/.test(c.effectiveType||"");
    if(c.downlink){$("statSpeed").textContent=c.downlink.toFixed(1)+" Mbps"}
  }
  updateBanner();
  if(state.hlsInst)applyAdaptiveCap();
}
function setupNetInfo(){
  if(navigator.connection){
    applyNetInfo();
    navigator.connection.addEventListener("change",applyNetInfo);
  } else {
    $("statSpeed").textContent="—";
  }
}
function updateBanner(){
  if(state.bannerDismissed){$("netBanner").classList.remove("vis");return}
  const slow=state.netInfo.slow;
  const sd=state.netInfo.saveData||state.dataSaver;
  if(sd||slow){
    $("netBannerText").textContent = sd?T("netBannerSaveData"):T("netBannerSlow");
    $("netBanner").classList.add("vis");
  }else{$("netBanner").classList.remove("vis")}
}
function setupBattery(){
  if(!navigator.getBattery)return;
  navigator.getBattery().then(b=>{
    const tick=()=>{
      const low=b.level<0.18 && !b.charging;
      if(low && !state.dataSaver){
        state.dataSaver=true;prefsSave();
        if($("setDS"))$("setDS").classList.add("on");
        showToast("🔋 "+T("dataSaver")+" → ON");
        updateBanner();applyAdaptiveCap();
      }
    };
    tick();
    b.addEventListener&&b.addEventListener("levelchange",tick);
    b.addEventListener&&b.addEventListener("chargingchange",tick);
  }).catch(()=>{});
}
function setupVisibility(){
  document.addEventListener("visibilitychange",()=>{
    const v=$("video");
    if(document.hidden){
      if(state.muteWhenHidden && !v.muted){state._mutedByHidden=true;v.muted=true;updateMuteUI()}
      if(state.hlsInst)try{state.hlsInst.stopLoad()}catch(e){}
      releaseWakeLock();
    } else {
      if(state._mutedByHidden){v.muted=state.lastMuted;state._mutedByHidden=false;updateMuteUI()}
      if(state.hlsInst)try{state.hlsInst.startLoad()}catch(e){}
      if(!v.paused)acquireWakeLock();
    }
  });
}

   M3U PARSE + PACK LOADING
   ────────────────────────────────────────────────────────────── */
const SPORT_KW=["sport","sports","spor","رياضة","ورزش","وەرزش","football","soccer","nba","nfl","espn","bein","premier","liga","serie","bundesliga","cricket","tennis","golf","eurosport","ssc","ksa sport","abu dhabi sport"];

function parseM3U(text){
  const lines=text.split("\n");const out=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line.startsWith("#EXTINF"))continue;
    let next="";
    let j=i+1;
    while(j<lines.length){
      const ln=lines[j].trim();
      if(!ln){j++;continue}
      if(ln.startsWith("#")){j++;continue}
      next=ln;break;
    }
    if(!next||!/^https?:\/\//.test(next))continue;
    const name=(line.match(/,([^,]*)$/)||[])[1]?.trim()||"Live TV";
    const logo=(line.match(/tvg-logo="([^"]*)"/)||[])[1]||"";
    let group=(line.match(/group-title="([^"]*)"/)||[])[1]||"TV";
    const nl=name.toLowerCase(),gl=group.toLowerCase();
    if(SPORT_KW.some(k=>nl.includes(k)||gl.includes(k)))group="وەرزش";
    out.push({name,category:group,logo:logo||FB,stream:next});
  }
  return out;
}

const PROXIES=["https://corsproxy.io/?","https://api.allorigins.win/raw?url="];
async function fetchM3U(url,timeoutMs=12000){
  const tryFetch=async(u)=>{
    const c=new AbortController();const tid=setTimeout(()=>c.abort(),timeoutMs);
    try{const r=await fetch(u,{signal:c.signal,cache:"force-cache"});clearTimeout(tid);if(!r.ok)return null;return await r.text()}
    catch(e){clearTimeout(tid);return null}
  };
  let txt=await tryFetch(url);
  if(txt)return txt;
  for(const px of PROXIES){
    txt=await tryFetch(px+encodeURIComponent(url));
    if(txt)return txt;
  }
  return null;
}

function mergeChannels(newOnes,packKey){
  let added=0;
  for(const ch of newOnes){
    if(!ch||!ch.stream)continue;
    if(state.channelByUrl.has(ch.stream))continue;
    if(packKey&&!ch.pack)ch.pack=packKey;
    state.channels.push(ch);
    state.channelByUrl.set(ch.stream,ch);
    added++;
  }
  // Channels in the live country page need to reflect new arrivals.
  if(state.page==="country-list"&&state.activeCountry===packKey)renderCountryList();
  return added;
}

async function loadPack(key,{quiet}={quiet:false}){
  const p=PACKS[key];if(!p)return 0;
  if(state.packsLoaded.has(key))return 0;
  if(state.packsLoading.has(key))return 0;

  state.packsLoading.add(key);state.packsFailed.delete(key);
  renderPacks();

  // Try cache first
  const cached=packCacheGet(key);
  if(cached){
    const n=mergeChannels(cached.channels,key);
    state.packCounts[key]=cached.channels.length;
    state.packsLoaded.add(key);state.packsLoading.delete(key);
    renderPacks();renderChannels();renderCats();renderCountriesPage();
    if(!quiet)showToast("✓ "+p.label+" — "+(cached.channels.length)+" "+T("channels"));
    return n;
  }
  const txt=await fetchM3U(p.url);
  state.packsLoading.delete(key);
  if(!txt){
    state.packsFailed.add(key);renderPacks();renderCountriesPage();
    if(!quiet)showToast("⚠ "+p.label+" — failed");
    return 0;
  }
  const parsed=parseM3U(txt);
  packCacheSet(key,parsed);
  const n=mergeChannels(parsed,key);
  state.packCounts[key]=parsed.length;
  state.packsLoaded.add(key);
  renderPacks();renderChannels();renderCats();renderCountriesPage();
  if(!quiet)showToast("✓ "+p.label+" — "+parsed.length+" "+T("channels"));
  return n;
}

async function loadAutoPacks(){
  // Load EVERY pack (every region + every category). Six in parallel at a time
  // so we don't melt the network. Failures are silently skipped — the next pack
  // still gets a chance. After this, every world channel is in the list.
  const hint=$("loadingHint");hint.style.display="block";hint.textContent=T("loading");
  setBar(8);
  const keys=Object.keys(PACKS);
  const BATCH=6;
  let done=0;
  for(let i=0;i<keys.length;i+=BATCH){
    const slice=keys.slice(i,i+BATCH);
    await Promise.allSettled(slice.map(k=>loadPack(k,{quiet:true})));
    done+=slice.length;
    setBar(8+(done/keys.length)*80);
  }
  setBar(100);setTimeout(()=>setBar(0),700);hint.style.display="none";
  renderAll();
}

function setPage(p){
  state.page=p;

  $("tab-countries").classList.toggle("on",p==="countries"||p==="country-list");

  }

  window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});

function routeFromHash(){
  if(state._suppressHash)return;
  const h=(location.hash||"").replace(/^#/,"");
  if(!h){setPage("watch");return}
  if(h==="countries"){setPage("countries");return}
  if(h==="support"){setPage("support");return}
  const m=h.match(/^country=(.+)$/);
  if(m&&PACKS[m[1]]){openCountry(m[1]);return}
  setPage("watch");
}

function extractFlag(label){
  // Country flag (two regional-indicator letters) OR any other pictograph.
  const m=(label||"").match(/[\u{1F1E6}-\u{1F1FF}][\u{1F1E6}-\u{1F1FF}]|[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u);
  return m?m[0]:"🌍";
}
function extractName(label){
  return (label||"").replace(/[\u{1F1E6}-\u{1F1FF}][\u{1F1E6}-\u{1F1FF}]|[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim();
}

function renderCountriesPage(){
  const rGrid=$("countriesRegionGrid");const cGrid=$("countriesCatGrid");
  if(!rGrid||!cGrid)return;
  const tileFor=(key)=>{
    const p=PACKS[key];if(!p)return"";
    const cnt=state.packCounts[key]||0;
    const isLoading=state.packsLoading.has(key);
    const isLoaded=state.packsLoaded.has(key);
    const flag=extractFlag(p.label);
    const nameOnly=extractName(p.label)||key;
    const empty=isLoaded&&cnt===0?"empty":"";
    const cntTxt=isLoading?"…":(cnt+" "+T("channels"));
    return `<button class="country-tile ${isLoading?"loading":""} ${empty}" data-act="open-country" data-key="${esc(key)}">
      <div class="ct-flag">${esc(flag)}</div>
      <div class="ct-name">${esc(nameOnly)}</div>
      <div class="ct-count">${esc(cntTxt)}</div>
    </button>`;
  };
  const regKeys=Object.keys(PACKS).filter(k=>PACKS[k].group==="region");
  const catKeys=Object.keys(PACKS).filter(k=>PACKS[k].group==="cat");
  rGrid.innerHTML=regKeys.map(tileFor).join("");
  cGrid.innerHTML=catKeys.map(tileFor).join("");
}

const CAT_ORDER=["کوردی","عەرەبی","جیهانی","وەرزش","Custom"];
function sortChannels(arr){
  if(state.sortMode==="az")return [...arr].sort((a,b)=>a.name.localeCompare(b.name));
  if(state.sortMode==="country")return [...arr].sort((a,b)=>{
    const ca=CAT_ORDER.indexOf(a.category)<0?99:CAT_ORDER.indexOf(a.category);
    const cb=CAT_ORDER.indexOf(b.category)<0?99:CAT_ORDER.indexOf(b.category);
    if(ca!==cb)return ca-cb;return a.name.localeCompare(b.name);
  });
  if(state.sortMode==="live")return [...arr].sort((a,b)=>{
    // OK first, everything else equal — no "dead" tier any more.
    const av=state.okSet.has(a.stream)?0:1;
    const bv=state.okSet.has(b.stream)?0:1;
    return av-bv;
  });
  return arr;
}
function setSort(m){
  state.sortMode=m;prefsSave();
  ["sortDefault","sortAZ","sortCountry","sortLive"].forEach((id,i)=>{
    const el=$(id);if(el)el.classList.toggle("on",["default","az","country","live"][i]===m);
  });
  renderChannels();
}

  $("catBar").innerHTML=list.map(cat=>
    `<button class="cb ${state.activeCat===cat?"on":""}" data-act="set-cat" data-cat="${esc(cat)}">${esc(cat)}</button>`
  ).join("");

function chiHTML(ch,opts={}){
  // Every channel is clickable — we never blacken or hide. The small status
  // dot is informational only (green = confirmed-ok, grey = unknown).
  const isOk=state.okSet.has(ch.stream);
  const isSel=state.selected&&state.selected.stream===ch.stream;
  const isFav=state.favSet.has(ch.stream);
  const durLbl=state.durMap[ch.stream]?getDurLabel(ch.stream):"";
  const stClass=isOk?"ok":"unk";
  const letter=letterOf(ch.name);
  const showFav = !opts.hideFav;
  return `<button class="chi ${isSel?"on":""} ${isFav?"fav":""}" data-act="select" data-url="${esc(ch.stream)}" data-name="${esc(ch.name)}">
    <div class="chlo" data-letter="${esc(letter)}"><img src="${esc(ch.logo||FB)}" alt="" loading="lazy" decoding="async" data-fallback="1"/></div>
    <div class="chm">
      <div class="chn">${esc(ch.name)}</div>
      <div class="chc">${esc(ch.category||"")}</div>
      ${durLbl?`<div class="ch-dur">⏱ ${esc(durLbl)}</div>`:""}
    </div>
    ${showFav?`<button class="ch-fav" data-act="toggle-fav-url" data-url="${esc(ch.stream)}" title="fav">${isFav?"⭐":"☆"}</button>`:""}
    <div class="chst ${stClass}"></div>
  </button>`;
}

function renderChannels(){
  const q=($("searchInput").value||"").toLowerCase().trim();
  const allKey=T("allCat");
  let filtered=state.channels.filter(c=>{
    if(c.userAdded)return false;
    const mc=state.activeCat===allKey||c.category===state.activeCat;
    const ms=!q||c.name.toLowerCase().includes(q)||(c.category||"").toLowerCase().includes(q);
    return mc&&ms;
  });
  filtered=sortChannels(filtered);
  const total=state.channels.length;
  const limited=filtered.slice(0,RENDER_LIMIT);
  const overflow=filtered.length-limited.length;
  $("chCount").textContent=total;$("statCh").textContent=total;$("statOk").textContent=state.okSet.size;
  const inline=$("allChCountInline");if(inline)inline.textContent=filtered.length+" / "+total;
  const list=$("chList");
  if(!limited.length){list.innerHTML=`<div style="text-align:center;color:var(--tm);padding:20px;font-family:var(--fd);font-size:12px">${esc(T("noChannels"))}</div>`;return}
  const rows=limited.map(ch=>chiHTML(ch));
  if(overflow>0)rows.push(`<div style="text-align:center;color:var(--tm);padding:8px;font-family:var(--fd);font-size:10px;letter-spacing:.5px">+ ${overflow} — ${esc(T("search"))}</div>`);
  list.innerHTML=rows.join("");
}

function selectChByUrl(url){
  const ch=state.channelByUrl.get(url);
  if(!ch)return;
  // No dead-channel guard: every channel is clickable, user retries freely.
  state.selected=ch;
  // Picking a channel from the countries/country-list view jumps back to the
  // watch page so the player is visible immediately.
  if(state.page!=="watch")setPage("watch");
  playChannel(ch);renderAll();
}

function playChannel(ch){
  $("curName").textContent=ch.name;
  $("curCat").textContent=ch.category||"";
  const wrap=$("curLogoWrap");const img=$("curLogo");
  $("curLetter").textContent=letterOf(ch.name);
  wrap.classList.remove("no-logo");
  img.src=ch.logo||FB;
  img.onerror=()=>{wrap.classList.add("no-logo")};
  $("videoError").style.display="none";
  $("video").style.display="block";
  $("spinner").classList.remove("on");
  $("qualWrap").classList.remove("vis");
  updateFavBtn();updateDurDisplay();
  loadStream(ch);
}

function showStreamError(){
  $("video").style.display="none";
  $("spinner").classList.remove("on");
  $("videoError").style.display="flex";
}

function markDead(ch){
  // User explicitly asked: never mark a channel as dead. Keep status indicators
  // tracking-only so the small dot can hint at health, but never disable the
  // channel, hide it, strike it through, or block clicks.
  state.okSet.delete(ch.stream);
  showStreamError();renderAll();
  showToast("⚠️ "+ch.name+" — "+T("channelDead"));
}

function applyAdaptiveCap(){
  const hls=state.hlsInst;if(!hls||!hls.levels||hls.levels.length<2)return;
  const sd=state.dataSaver||state.netInfo.saveData;
  const slow=state.netInfo.slow||(state.netInfo.dl&&state.netInfo.dl<1.2);
  if(sd){hls.currentLevel=0;return}
  if(slow){hls.currentLevel=0;return}
  if(hls.currentLevel!==-1 && !state._userPickedQuality)hls.currentLevel=-1;
}

function loadStream(ch){
  const video=$("video");
  state._userPickedQuality=false;
  if(state.hlsInst){try{state.hlsInst.destroy()}catch(e){}state.hlsInst=null}
  const url=ch.stream;
  if(/^rtmp:\/\//i.test(url)){markDead(ch);return}
  if(typeof Hls==="undefined"){showStreamError();return}

  state.hlsRetries=0;
  $("spinner").classList.add("on");

  if(Hls.isSupported()){
    const sd=state.dataSaver||state.netInfo.saveData||state.netInfo.slow;
    const hls=new Hls({
      enableWorker:true,
      lowLatencyMode:false,
      backBufferLength:sd?0:4,
      maxBufferLength:sd?4:8,
      maxMaxBufferLength:sd?6:12,
      maxBufferSize:sd?12*1000*1000:30*1000*1000,
      maxBufferHole:0.5,
      manifestLoadingMaxRetry:1,
      manifestLoadingRetryDelay:1500,
      manifestLoadingMaxRetryTimeout:8000,
      levelLoadingMaxRetry:1,
      levelLoadingRetryDelay:1500,
      fragLoadingMaxRetry:2,
      fragLoadingRetryDelay:1500,
      fragLoadingMaxRetryTimeout:8000,
      abrEwmaDefaultEstimate:sd?400000:800000,
      startLevel:sd?0:-1,
      capLevelToPlayerSize:true,
      testBandwidth:!sd,
    });
    hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{
      state.okSet.add(url);
      $("spinner").classList.remove("on");
      if(state.autoplay)video.play().catch(()=>{});
      renderChannels();
      const qs=$("qualSel");qs.innerHTML='<option value="-1">Auto</option>';
      if(d.levels&&d.levels.length>1){
        d.levels.forEach((l,i)=>{
          const o=document.createElement("option");
          o.value=i;o.textContent=(l.height?l.height+"p ":"")+(l.bitrate?(l.bitrate/1000).toFixed(0)+"k":"L"+(i+1));
          qs.appendChild(o);
        });
        $("qualWrap").classList.add("vis");
      }
      applyAdaptiveCap();
      if(!video.paused)acquireWakeLock();
    });
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal)return;
      // Bounded retry with backoff — DO NOT loop infinitely.
      state.hlsRetries++;
      if(state.hlsRetries>state.HLS_MAX_RETRIES){markDead(ch);return}
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){
        setTimeout(()=>{try{hls.startLoad()}catch(e){}},state.HLS_RETRY_DELAY*state.hlsRetries);
      } else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){
        try{hls.recoverMediaError()}catch(e){markDead(ch)}
      } else {
        markDead(ch);
      }
    });
    hls.loadSource(url);hls.attachMedia(video);state.hlsInst=hls;
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url;
    video.oncanplay=()=>{state.okSet.add(url);renderChannels();$("spinner").classList.remove("on");if(state.autoplay)video.play().catch(()=>{})};
    video.onerror=()=>markDead(ch);
  } else {showStreamError()}
}

function changeQuality(){
  if(!state.hlsInst)return;
  state._userPickedQuality=true;
  state.hlsInst.currentLevel=parseInt($("qualSel").value);
}

function retryStream(){if(state.selected){state.okSet.delete(state.selected.stream);playChannel(state.selected)}}

/* ──────────────────────────────────────────────────────────────
   PIP / FULLSCREEN / VOLUME / MUTE
   ────────────────────────────────────────────────────────────── */
function openPiP(){
  const v=$("video");
  try{
    if(document.pictureInPictureEnabled&&v.requestPictureInPicture){
      document.pictureInPictureElement?document.exitPictureInPicture():v.requestPictureInPicture().catch(()=>showToast("PiP not supported"));
    } else showToast("PiP not supported");
  }catch(e){showToast("PiP not supported")}
}
function goFullscreen(){
  const v=$("video");
  const fn=v.requestFullscreen||v.webkitRequestFullscreen||v.webkitEnterFullscreen||v.mozRequestFullScreen;
  if(fn)fn.call(v);
}
function updateMuteUI(){const v=$("video");$("muteBtn").textContent=v.muted||v.volume===0?"🔇":"🔊"}
function toggleMute(){const v=$("video");v.muted=!v.muted;state.lastMuted=v.muted;prefsSave();updateMuteUI()}

/* ──────────────────────────────────────────────────────────────
   SHARE / ADD
   ────────────────────────────────────────────────────────────── */
function openShareModal(){
  if(!state.selected)return;
  $("shareChName").textContent=state.selected.name;
  $("shareUrl").textContent=state.selected.stream;
  const url=encodeURIComponent(state.selected.stream);
  const name=encodeURIComponent(state.selected.name);
  $("shareApps").innerHTML=[
    {label:"VLC",ico:"🎬",href:`vlc://${state.selected.stream.replace(/^https?:\/\//,"")}`},
    {label:"MX Player",ico:"▶️",href:`mx://${state.selected.stream.replace(/^https?:\/\//,"")}`},
    {label:"WhatsApp",ico:"💬",href:`https://wa.me/?text=${name}%20${url}`},
    {label:"Telegram",ico:"✈️",href:`https://t.me/share/url?url=${url}&text=${name}`},
    {label:"Kodi",ico:"📺",href:`plugin://plugin.video.iptv.recorder/?url=${url}`},
  ].map(a=>`<a class="sapp" href="${esc(a.href)}" target="_blank" rel="noopener"><span class="sapp-ico">${a.ico}</span>${esc(a.label)}</a>`).join("");
  openModal("shareModal");
}
function copyShareUrl(){if(!state.selected)return;copyText(state.selected.stream,"✓ "+T("copied"))}
function copyPhone(){
  const btn=$("copyBtn");const done=()=>{btn.textContent=T("copied");setTimeout(()=>{btn.textContent=T("copyNum")},1800)};
  copyText(PHONE,null,done);
}
function copyText(txt,toast,cb){
  const done=()=>{if(toast)showToast(toast);if(cb)cb()};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    try{const el=document.createElement("textarea");el.value=txt;el.style.position="fixed";el.style.opacity=0;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);done();}
    catch(e){showToast("Copy failed")}
  }
}

function toggleAdd(){
  state.addOpen=!state.addOpen;
  $("addForm").classList.toggle("open",state.addOpen);
  $("addToggle").classList.toggle("open",state.addOpen);
}

async function addChannels(){
  const bulk=$("inBulk").value.trim();
  if(!bulk){showToast("⚠️ empty");return}
  let added=0,exists=0;
  const lines=bulk.split("\n");
  let pendingName=null,pendingLogo=FB,pendingCat="Custom";
  const newOnes=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();if(!line)continue;
    if(line.startsWith("#EXTINF")){
      pendingName=(line.match(/,([^,]*)$/)||[])[1]?.trim()||null;
      pendingLogo=(line.match(/tvg-logo="([^"]*)"/)||[])[1]||FB;
      pendingCat=(line.match(/group-title="([^"]*)"/)||[])[1]||"Custom";
      continue;
    }
    if(line.startsWith("#"))continue;
    let rawName,url;
    if(pendingName&&/^https?:\/\//.test(line)){
      rawName=pendingName;url=line;pendingName=null;
    } else {
      const semi=line.indexOf(";");
      if(semi<1){pendingName=null;continue}
      rawName=line.slice(0,semi).trim();url=line.slice(semi+1).trim();
    }
    if(!url||!/^https?:\/\//.test(url)){pendingName=null;continue}
    if(state.channelByUrl.has(url)){exists++;continue}
    if(state.channels.find(c=>c.name.toLowerCase().trim()===rawName.toLowerCase().trim())){exists++;continue}
    const name=rawName.replace(/[-_]/g," ").replace(/\s+/g," ").trim();
    const ch={name,category:pendingCat||"Custom",logo:pendingLogo||FB,stream:url,userAdded:true};
    state.channels.push(ch);state.channelByUrl.set(url,ch);
    newOnes.push(ch);added++;
    pendingLogo=FB;pendingCat="Custom";
  }
  $("inBulk").value="";
  if(added){
    const prev=sharedGet();const merged=[...prev];
    newOnes.forEach(nc=>{
      const idx=merged.findIndex(c=>c.name.toLowerCase().trim()===nc.name.toLowerCase().trim());
      if(idx>=0)merged[idx]=nc;else merged.push(nc);
    });
    sharedSet(merged);
    renderAll();
    showToast("✅ "+added+" "+T("channels"));
    if(state.addOpen)toggleAdd();
  } else if(!exists)showToast("⚠️ No valid channels");
  else showToast(T("chExists"));
}

function clearMyChannels(){
  const before=state.channels.length;
  state.channels=state.channels.filter(c=>!c.userAdded);
  state.channelByUrl.clear();
  state.channels.forEach(c=>state.channelByUrl.set(c.stream,c));
  sharedSet([]);renderAll();
  showToast("🗑 Cleared "+(before-state.channels.length));
}

/* ──────────────────────────────────────────────────────────────
   MODALS
   ────────────────────────────────────────────────────────────── */
function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}

/* ──────────────────────────────────────────────────────────────
   EVENT DELEGATION
   ────────────────────────────────────────────────────────────── */
function handleClick(e){
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const a=el.getAttribute("data-act");
  switch(a){
    case "set-lang":   setLang(el.dataset.lang);break;
    case "toggle-theme":toggleTheme();break;
    case "set-page":   setPage(el.dataset.page);break;
    case "toggle-enhance":state.enhanceOn=!state.enhanceOn;$("enhToggle").classList.toggle("on",state.enhanceOn);break;
    case "open-pip":   openPiP();break;
    case "fullscreen": goFullscreen();break;
    case "toggle-mute":toggleMute();break;
    case "toggle-fav": toggleFav();break;
    case "toggle-fav-url":e.stopPropagation();toggleFavStream(el.dataset.url);break;
    case "open-share": openShareModal();break;
    case "copy-share-url":copyShareUrl();break;
    case "open-dur":   openDurModal();break;
    case "save-duration":saveDuration();break;
    case "dur-preset": setDurPreset(parseInt(el.dataset.mins)||0);break;
    case "close-modal":closeModal(el.dataset.modal);break;
    case "open-donate":openModal("donateModal");break;
    case "copy-phone": copyPhone();break;
    case "open-set":   openModal("setModal");break;
    case "toggle-ds":  state.dataSaver=!state.dataSaver;$("setDS").classList.toggle("on",state.dataSaver);prefsSave();applyAdaptiveCap();updateBanner();break;
    case "toggle-auto":state.autoplay=!state.autoplay;$("setAuto").classList.toggle("on",state.autoplay);prefsSave();break;
    case "toggle-wake":state.wakeLockOn=!state.wakeLockOn;$("setWake").classList.toggle("on",state.wakeLockOn);prefsSave();state.wakeLockOn?acquireWakeLock():releaseWakeLock();break;
    case "toggle-hide":state.muteWhenHidden=!state.muteWhenHidden;$("setHide").classList.toggle("on",state.muteWhenHidden);prefsSave();break;
    case "size":       adjustSize(parseInt(el.dataset.d)||0);break;
    case "sort":       setSort(el.dataset.m);break;
    case "set-cat":    setCategory(el.dataset.cat);break;
    case "toggle-packs":togglePacks();break;
    case "toggle-add": toggleAdd();break;
    case "add-channels":addChannels();break;
    case "clear-my":   clearMyChannels();break;
    case "load-pack":  loadPack(el.dataset.key);break;
    case "open-country":openCountry(el.dataset.key);break;
    case "open-countries":setPage("countries");break;
    case "load-popular":loadMany(POPULAR_KEYS);break;
    case "load-all-arab":loadMany(ARAB_KEYS);break;
    case "clear-cache":packCacheClearAll();showToast("🗑 cache cleared");break;
    case "retry-stream":retryStream();break;
    case "select":     selectChByUrl(el.dataset.url);break;
    case "dead-info":  showToast("⚠️ "+(el.dataset.name||"")+" — "+T("channelDead"));break;
    case "toggle-favlist":toggleFavList();break;
    case "toggle-recent":toggleRecentList();break;
    case "dismiss-banner":state.bannerDismissed=true;$("netBanner").classList.remove("vis");break;
  }
}

async function loadMany(keys){
  for(const k of keys){await loadPack(k,{quiet:true})}
  showToast("✓ "+keys.length+" packs");
}

function togglePacks(){
  state.packsOpen=!state.packsOpen;
  $("packsBody").classList.toggle("open",state.packsOpen);
  $("packsHdr").classList.toggle("open",state.packsOpen);
  $("packsIcon").textContent=state.packsOpen?"−":"+";
  if(state.packsOpen)renderPacks();
}

/* ──────────────────────────────────────────────────────────────
   INIT
   ────────────────────────────────────────────────────────────── */
function bindEvents(){
  document.addEventListener("click",handleClick,{passive:false});
  document.addEventListener("touchstart",()=>{},{passive:true});

  // Logo img fallback (delegated)
  document.addEventListener("error",e=>{
    const t=e.target;
    if(t&&t.tagName==="IMG"&&t.dataset.fallback==="1"){
      const wrap=t.parentElement;
      if(wrap&&wrap.classList){wrap.classList.add("no-logo")}
      t.dataset.fallback="";
    }
  },true);

  // Search debounced
  $("searchInput").addEventListener("input",debounce(()=>renderChannels(),180));
  // Country-page search (separate debounce, scoped to one country at a time)
  const cphS=$("cphSearch");
  if(cphS)cphS.addEventListener("input",debounce(()=>renderCountryList(),180));
  // Hash routing so the browser back-button returns to the countries hub.
  window.addEventListener("hashchange",routeFromHash);

  // Size slider
  $("sizeSlider").addEventListener("input",e=>{state.chSize=parseInt(e.target.value);applySize();sizeSave()});

  // Quality dropdown
  $("qualSel").addEventListener("change",changeQuality);

  // Volume
  const v=$("video"),vol=$("volSl");
  v.addEventListener("loadedmetadata",()=>{$("volOverlay").style.display="flex";v.volume=state.lastVolume;v.muted=state.lastMuted;vol.value=Math.round(state.lastVolume*100);updateMuteUI()});
  vol.addEventListener("input",()=>{const x=parseInt(vol.value)/100;v.volume=x;v.muted=x===0;state.lastVolume=x;state.lastMuted=v.muted;prefsSave();updateMuteUI()});
  v.addEventListener("play",()=>{acquireWakeLock()});
  v.addEventListener("pause",()=>{releaseWakeLock()});
  v.addEventListener("ended",()=>{releaseWakeLock()});
  v.addEventListener("volumechange",updateMuteUI);
  v.addEventListener("waiting",()=>$("spinner").classList.add("on"));
  v.addEventListener("playing",()=>$("spinner").classList.remove("on"));
  v.addEventListener("error",()=>{if(state.selected)markDead(state.selected)});

  // Modal click-outside-to-close
  ["donateModal","shareModal","durModal","setModal"].forEach(id=>{
    $(id).addEventListener("click",e=>{if(e.target.id===id)closeModal(id)});
  });

  // Keyboard
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
    const v=$("video");
    switch(e.key){
      case " ":case "k":e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause();break;
      case "f":e.preventDefault();goFullscreen();break;
      case "p":e.preventDefault();openPiP();break;
      case "m":e.preventDefault();toggleMute();break;
      case "ArrowUp":e.preventDefault();const cv=Math.min(1,(v.volume||0)+0.05);v.volume=cv;state.lastVolume=cv;prefsSave();$("volSl").value=Math.round(cv*100);break;
      case "ArrowDown":e.preventDefault();const cd=Math.max(0,(v.volume||0)-0.05);v.volume=cd;state.lastVolume=cd;prefsSave();$("volSl").value=Math.round(cd*100);break;
      case "ArrowLeft":case "ArrowRight":{
        e.preventDefault();
        const list=state.channels.slice();
        if(!list.length||!state.selected)return;
        let i=list.findIndex(c=>c.stream===state.selected.stream);
        i=e.key==="ArrowRight"?(i+1)%list.length:(i-1+list.length)%list.length;
        selectChByUrl(list[i].stream);
        break;
      }
    }
  });
}

function applyTogglesUI(){
  $("setDS").classList.toggle("on",state.dataSaver);
  $("setAuto").classList.toggle("on",state.autoplay);
  $("setWake").classList.toggle("on",state.wakeLockOn);
  $("setHide").classList.toggle("on",state.muteWhenHidden);
}

function bootChannels(){
  // Built-in
  for(const b of BUILTIN){
    const ch={name:b.name,category:b.cat,logo:b.logo,stream:b.url};
    state.channels.push(ch);state.channelByUrl.set(ch.stream,ch);
  }
  // User-added persisted
  const shared=sharedGet();
  for(const ch of shared){
    if(!ch||!ch.stream)continue;
    if(state.channelByUrl.has(ch.stream))continue;
    const c={...ch,userAdded:true};state.channels.push(c);state.channelByUrl.set(c.stream,c);
  }
  // Cached packs (instant)
  for(const k of Object.keys(PACKS)){
    const cached=packCacheGet(k);
    if(cached){mergeChannels(cached.channels,k);state.packCounts[k]=cached.channels.length;state.packsLoaded.add(k)}
  }
}

function init(){
  prefsLoad();favLoad();durLoad();recentLoad();sizeLoad();
  if(state.dayMode){document.body.classList.add("day-mode");$("themeBtn").textContent="🌙"}
  applySize();
  bootChannels();
  applyLang();
  applyTogglesUI();
  state.selected=state.channels[0];
  renderAll();renderPacks();
  if(state.selected)playChannel(state.selected);

  bindEvents();
  setupNetInfo();setupBattery();setupVisibility();
  registerSW();

  // Honour the initial #hash (deep links from a bookmarked country page work)
  routeFromHash();

  // Auto-load packs after initial render (idle)
  rIdle(()=>{loadAutoPacks()},800);
}

if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init)} else init();
</script>
